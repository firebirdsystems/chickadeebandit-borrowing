<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borrowing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: var(--bg);
      --green: var(--hub-tint-success-fg, #16a34a); --green-light: var(--hub-tint-success, #dcfce7);
      --amber: var(--hub-tint-warning-fg, #d97706); --amber-light: var(--hub-tint-warning, #fef3c7);
      --red: #dc2626;   --red-light: #fee2e2;
      --blue: #2563eb;  --blue-light: #dbeafe;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 600px; margin: 0 auto; padding: 16px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: var(--accent);
      border-radius: var(--radius);
      color: var(--accent-fg);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 2px; }

    /* ── Buttons ───────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover:not(:disabled) { opacity: .88; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover { border-color: var(--text); color: var(--text); }
    .btn-danger { background: var(--red); color: white; }
    .btn-danger:hover:not(:disabled) { opacity: .88; }
    .btn-success { background: var(--green); color: white; }
    .btn-success:hover:not(:disabled) { opacity: .88; }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: 4px;
      background: var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      padding: 7px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .tab-badge {
      background: var(--amber);
      color: white;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      min-width: 18px;
      text-align: center;
    }

    /* ── Request cards ────────────────────────────────────── */
    .request-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
      transition: border-color .15s, box-shadow .15s;
    }
    .request-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(124,58,237,.1); }
    .request-card.needs-action { border-color: var(--amber); background: var(--hub-tint-warning, #fffbeb); }

    .request-main { flex: 1; min-width: 0; }
    .request-item { font-weight: 600; font-size: 1rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .request-meta {
      font-size: 0.82rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .request-dates { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

    .request-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 5px;
      flex-shrink: 0;
    }
    .action-needed {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--amber);
      text-align: right;
    }

    /* ── Agreement dots ──────────────────────────────────── */
    .agree-dots {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .agree-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      background: transparent;
      display: inline-block;
    }
    .agree-dot.on { background: var(--green); border-color: var(--green); }

    /* ── Status badges ───────────────────────────────────── */
    .status-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .status-pending   { background: var(--amber-light);  color: var(--amber); }
    .status-locked    { background: var(--accent-light); color: var(--accent); }
    .status-returned  { background: var(--green-light);  color: var(--green); }
    .status-cancelled { background: var(--border);       color: var(--muted); }

    /* ── Avatar ──────────────────────────────────────────── */
    .avatar {
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }
    .avatar.sm { width: 24px; height: 24px; font-size: 0.7rem; }
    .avatar.xs { width: 18px; height: 18px; font-size: 0.62rem; }
    .avatar.md { width: 36px; height: 36px; font-size: 1rem; }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    @media (min-width: 480px) {
      .modal-backdrop { align-items: center; padding: 20px; }
    }
    .modal {
      background: var(--card);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      max-height: 92vh;
      overflow-y: auto;
    }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }

    .modal h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 16px; }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      background: var(--card);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group .row { display: flex; gap: 10px; }
    .form-group .row > * { flex: 1; }

    .form-notice {
      background: var(--amber-light);
      color: var(--amber);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    /* ── Condition toggles ────────────────────────────────── */
    .condition-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .condition-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      transition: all .15s;
      user-select: none;
    }
    .condition-toggle input { display: none; }
    .condition-toggle.selected {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent);
    }
    .condition-toggle:hover { border-color: var(--accent); }

    /* ── Modal actions ───────────────────────────────────── */
    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 100px; }

    /* ── Detail view ─────────────────────────────────────── */
    .detail-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .detail-header h3 { margin-bottom: 0; }
    .detail-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .detail-field {}
    .detail-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .detail-value { font-size: 0.92rem; font-weight: 500; }
    .member-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-section {
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .condition-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .condition-pill {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Agreement row ───────────────────────────────────── */
    .agreement-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .agreement-person {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      flex: 1;
      min-width: 120px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .agreement-person.agreed {
      border-color: var(--green);
      background: var(--green-light);
    }
    .agree-check {
      margin-left: auto;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }
    .agreement-person.agreed .agree-check { color: var(--green); }

    /* ── Locked notice ───────────────────────────────────── */
    .locked-notice {
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 4px;
      text-align: center;
    }

    /* ── Misc ────────────────────────────────────────────── */
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .section-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }

    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/borrowing/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, hubConfirm, searchMatch, glyph } from "/hub-sdk.js";
import {
  CONDITION_OPTIONS, STATUS_INFO,
  conditionLabel, formatDate,
  filterRequests, pendingBadgeCount,
  needsMyAction, willLockOnAgree, waitingOnTheirReview, searchableFields,
  outcomeUnknown, storedDiffers, SAVED_AS_FIRST, failureLine,
} from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const APP_ID  = window.__APP_ID      ?? "borrowing";
const ME      = window.__CURRENT_MEMBER ?? null;

// ─── State ────────────────────────────────────────────────────────────────
let members  = [];
let requests = [];
let activeTab = "for-me"; // "for-me" | "from-me"
let searchQ = "";       // in-app search (see logic.js searchableFields)
let error = "";         // last failed write, shown above the list
let loadFailed = false; // the first load failed: the list is unknown, not empty

// ─── DB helper ────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json().catch(() => null);
  if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
  return json;
}

// Set the caller's OWN agreement flag via the server endpoint. The server verifies
// the caller is the borrower or lender and sets only their flag (locking when both
// agree) — a member can't forge the other party's agreement, or clear it.
// `terms` are the terms this page is showing: the hub refuses the agreement
// (409) when the terms it would record are not those.
async function agreeOnServer(reqId, agreed, terms) {
  const res = await fetch(`/run/${APP_ID}/api/agree`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ table: "request_agreements", id: reqId, agreed, ...(terms ? { expected_snapshot: terms } : {}) }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    // The hub's text goes to the console only; the page words the line itself
    // from the status (409: the terms changed under it; see failureLine).
    throw Object.assign(new Error(e?.error || "Agreement update failed"), { status: res.status, code: typeof e?.code === "string" ? e.code : undefined });
  }
  return res.json();
}

// ─── DB init ──────────────────────────────────────────────────────────────
async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

// ─── Load ─────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",   role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey",  role: "adult" },
    ];
    return;
  }
  // A roster that could not be read is a failed load, not an empty household.
  const res = await fetch(`${CONTEXT}?keys=family.members`);
  if (!res.ok) throw new Error(`context ${res.status}`);
  const json = await res.json();
  if (!json || typeof json !== "object") throw new Error("context: unexpected response");
  // A 200 that names the key in `$errors` is the hub saying it could not read it.
  if (Array.isArray(json.$errors) && json.$errors.includes("family.members")) throw new Error("context: family.members unavailable");
  members = json["family.members"] ?? [];
}

async function loadRequests() {
  if (!DB || !ME) return;
  // JOIN with request_agreements (endpoint_only, read:everyone) so agreement/lock
  // state is always read from the authoritative endpoint-only table.
  // For locked requests, read the agreed terms from the endpoint_only snapshot
  // columns on request_agreements (frozen at lock time) rather than from the
  // party_scoped requests row, which either party can still edit via raw /api/db.
  const { rows } = await db(`
    SELECT
      r.id, r.borrower_id, r.lender_id,
      r.created_at, r.updated_at,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.item_name, r.item_name)               ELSE r.item_name        END AS item_name,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.item_description, r.item_description)  ELSE r.item_description  END AS item_description,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.needed_date, r.needed_date)           ELSE r.needed_date      END AS needed_date,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.return_date, r.return_date)           ELSE r.return_date      END AS return_date,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.return_condition, r.return_condition) ELSE r.return_condition END AS return_condition,
      CASE WHEN ra.status = 'locked' THEN COALESCE(ra.if_not_returned, r.if_not_returned)   ELSE r.if_not_returned  END AS if_not_returned,
      COALESCE(ra.borrower_agreed, 0) AS borrower_agreed,
      COALESCE(ra.lender_agreed,   0) AS lender_agreed,
      CASE WHEN ra.item_name IS r.item_name AND ra.item_description IS r.item_description
            AND ra.needed_date IS r.needed_date AND ra.return_date IS r.return_date
            AND ra.return_condition IS r.return_condition AND ra.if_not_returned IS r.if_not_returned
           THEN 1 ELSE 0 END AS terms_current,
      CASE
        WHEN r.status IN ('cancelled','returned') THEN r.status
        WHEN ra.status = 'locked'                 THEN 'locked'
        ELSE 'pending'
      END AS status,
      ra.locked_at
    FROM app_borrowing__requests r
    LEFT JOIN app_borrowing__request_agreements ra ON ra.id = r.id
    WHERE (r.borrower_id = ? OR r.lender_id = ?)
    ORDER BY
      CASE
        WHEN r.status IN ('cancelled','returned') THEN 2
        WHEN ra.status = 'locked'                 THEN 1
        ELSE 0
      END,
      r.updated_at DESC
  `, [ME.id, ME.id]);
  requests = rows.map(r => {
    // An agreement stands only for the terms it was given on. The hub records
    // those terms with the first agreement, and one party cannot clear the
    // other's flag — so while a request is pending, a flag whose recorded terms
    // are not the request's terms now is an agreement to something that has
    // since been edited. It is not shown as agreed; `*_outdated` remembers it.
    const current = r.status !== "pending" || !!r.terms_current;
    return {
      ...r,
      return_condition: JSON.parse(r.return_condition ?? "[]"),
      return_condition_json: r.return_condition ?? "[]",
      borrower_agreed: !!r.borrower_agreed && current,
      lender_agreed:   !!r.lender_agreed && current,
      borrower_outdated: !!r.borrower_agreed && !current,
      lender_outdated:   !!r.lender_agreed && !current,
    };
  });
}

// The terms as this page shows them, in the shape the hub records them
// (manifest agreements.snapshot_columns).
function termsOf(req) {
  return {
    item_name: req.item_name ?? null, item_description: req.item_description ?? null,
    needed_date: req.needed_date ?? null, return_date: req.return_date ?? null,
    return_condition: req.return_condition_json ?? JSON.stringify(req.return_condition ?? []),
    if_not_returned: req.if_not_returned ?? null,
  };
}

// ─── Helpers ──────────────────────────────────────────────────────────────
function memberName(id) {
  return members.find(m => m.id === id)?.name ?? "Unknown";
}
function mc(id) { return memberColor(id, members); }

function statusHtml(status) {
  const { cls, label, glyph: mark } = STATUS_INFO[status] ?? STATUS_INFO.pending;
  return `<span class="status-badge ${cls}">${mark ? `${glyph(mark)} ` : ""}${label}</span>`;
}

// ─── Notifications ────────────────────────────────────────────────────────
async function notify(title, body) {
  await fetch(window.__NOTIFY_URL ?? "/api/notifications/send", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title, body, url: `/run/${APP_ID}` }),
  }).catch(() => {});
}

async function publishEvent(type, subjectId, payload = {}) {
  await fetch(`/run/${APP_ID}/api/events`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, subject_id: subjectId, payload }),
  }).catch(() => {});
}

// ─── Activity log ─────────────────────────────────────────────────────────
async function logActivity(requestId, borrowerId, lenderId, action, detail = "") {
  const id = crypto.randomUUID();
  await db(`INSERT INTO app_borrowing__activity (id, request_id, actor_id, borrower_id, lender_id, action, detail, created_at)
            VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
    [id, requestId, ME?.id ?? "system", borrowerId, lenderId, action, detail, new Date().toISOString()]);
}

// ─── Actions ──────────────────────────────────────────────────────────────
// A write that failed after the screen already showed it: say so, and redraw
// from what the hub actually holds. The hub's own error text goes to the
// console; the reader gets failureLine's line in the action's own words.
// A write that changed nothing passes `e` null and the request's `id`: the
// re-read decides between removed, refused and changed, and `closed` is the
// page's own line for a request the re-read finds returned or cancelled.
// `allowed` lists the statuses a guarded write's WHERE admits: a row found in
// one of them was refused by the row policy, not changed by someone else.
async function writeFailed(e, words, { id = null, allowed = null, closed = "" } = {}) {
  if (e) console.error(e);
  let found;
  try {
    await loadRequests();
    if (id) found = requests.some(r => r.id === id);
  } catch (readErr) {
    console.error(readErr); // keep the message; the list stays as drawn
    if (id) found = null;
  }
  const status = found ? requests.find(r => r.id === id)?.status : null;
  const guarded = !!allowed && !allowed.includes(status);
  error = closed && (status === "returned" || status === "cancelled")
    ? closed
    : failureLine(e, { ...words, found, guarded });
  render();
}
const SAVE_WORDS = { action: "save the request", thing: "request" };

// The re-read after a write the hub already stored. Its failure is logged, not
// reported: the write landed, and the page keeps what it drew.
function reloadAfterWrite(req = null) {
  return loadRequests().then(render, (e) => {
    console.error(e);
    if (req) req.saving = false;
    render();
  });
}

async function createRequest(fields, pinHost = null) {
  // The id is the form's, minted on its first Create and sent on every retry:
  // a try whose answer was lost may have stored the request, and a second
  // press must find it rather than ask (and notify the lender) twice.
  const id  = pinHost ? (pinHost.dataset.rowId ||= crypto.randomUUID()) : crypto.randomUUID();
  let now = new Date().toISOString();
  let note = "";

  // The form stays open until the hub has the request. A save that fails
  // throws to submitForm, which says so in the form and leaves what was typed
  // in place to send again — nothing is drawn in the list for a request the
  // hub never got.
  try {
    await db(`INSERT INTO app_borrowing__requests (
      id, item_name, item_description, borrower_id, lender_id,
      needed_date, return_date, return_condition, if_not_returned,
      status, created_at, updated_at
    ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, 'pending', ?, ?)`, [
      id, fields.item_name, fields.item_description, ME.id, fields.lender_id,
      fields.needed_date, fields.return_date,
      JSON.stringify(fields.return_condition), fields.if_not_returned,
      now, now,
    ]);
  } catch (e) {
    // Unknown outcome: read the request back by the pinned id. Found means an
    // earlier try landed and its success path never ran, so it runs now, once.
    // Not found, or the read failed: the save fails, the id stays pinned.
    if (!outcomeUnknown(e)) throw e;
    let stored = null, readFailed = false;
    try {
      stored = (await db(`SELECT item_name, item_description, lender_id, needed_date, return_date, return_condition, if_not_returned, created_at
        FROM app_borrowing__requests WHERE id = ?`, [id])).rows?.[0] ?? null;
    } catch (readErr) { console.error(readErr); readFailed = true; }
    // The id is ours: with the read-back failed, a UNIQUE answer may be this
    // form's own first try, so nothing is known — "try again", not "already exists".
    // The same words, without the status/code that would choose a refusal line.
    if (readFailed) throw new Error(String(e?.message ?? "create outcome unknown"), { cause: e });
    if (!stored) throw e;
    console.error(e);
    const typed = { ...fields, return_condition: JSON.stringify(fields.return_condition) };
    // Edited since that first try: what was stored is kept, and said so.
    if (storedDiffers(stored, typed)) note = SAVED_AS_FIRST;
    let return_condition = [];
    try { return_condition = JSON.parse(stored.return_condition || "[]"); } catch { /* drawn as none */ }
    fields = {
      item_name: stored.item_name, item_description: stored.item_description ?? "", lender_id: stored.lender_id,
      needed_date: stored.needed_date, return_date: stored.return_date,
      return_condition, if_not_returned: stored.if_not_returned ?? "",
    };
    now = stored.created_at || now;
  }
  if (pinHost) delete pinHost.dataset.rowId;

  requests = requests.filter(r => r.id !== id);
  requests.unshift({
    id, item_name: fields.item_name, item_description: fields.item_description,
    borrower_id: ME.id, lender_id: fields.lender_id,
    needed_date: fields.needed_date, return_date: fields.return_date,
    return_condition: fields.return_condition, if_not_returned: fields.if_not_returned,
    status: "pending", borrower_agreed: true, lender_agreed: false,
    created_at: now, updated_at: now, locked_at: null,
  });
  error = note;
  closeModal();
  render();

  // Fire-and-forget side effects, only once the request exists
  logActivity(id, ME.id, fields.lender_id, "created", `${ME.name} requested to borrow "${fields.item_name}"`).catch(() => {});
  notify(
    `${ME.name} wants to borrow something`,
    `${ME.name} is requesting to borrow "${fields.item_name}" from ${memberName(fields.lender_id)} — open Borrowing to review`,
  ).catch(() => {});
  publishEvent("borrowing.requested", id, { borrower: ME.name, item: fields.item_name, lender_id: fields.lender_id });
  // init_from_table creates request_agreements + sets borrower flag
  agreeOnServer(id, true).then(() => reloadAfterWrite(), (e) => writeFailed(e, SAVE_WORDS));

  // No activity-feed write here or at the two sibling sites below. That POST
  // used "message_posted", which is not one of the hub's own ActivityType
  // values a caller may write (CALLER_ALLOWED_ACTIVITY_TYPES) — the near
  // neighbour, conversation_message_posted, means a Household message and is
  // wired to the bell's Messages section, which a borrow request is not. So
  // the hub refused every call with a 403 and no household ever saw an entry;
  // a fetch does not reject on 4xx, so the .catch() hid it. It also sent an
  // `actor` the hub ignores, resolving that from the session instead.
  //
  // The borrowing.* events, and this app's own logActivity() audit rows, are
  // unaffected — they are different sinks and both work.
}

async function updateRequest(reqId, fields) {
  const req = requests.find(r => r.id === reqId);
  if (!req) return;
  const isBorrower = ME.id === req.borrower_id;
  const mineOnRecord = isBorrower ? (req.borrower_agreed || req.borrower_outdated) : (req.lender_agreed || req.lender_outdated);
  const now = new Date().toISOString();

  // As in createRequest, the form stays open until the hub has the edit: a
  // save that fails throws to submitForm, which says so in the form and
  // leaves what was typed in place to send again.
  const res = await db(`UPDATE app_borrowing__requests SET
    item_name = ?, item_description = ?,
    needed_date = ?, return_date = ?,
    return_condition = ?, if_not_returned = ?,
    updated_at = ?
    WHERE id = ? AND status = 'pending'`,
  [
    fields.item_name, fields.item_description,
    fields.needed_date, fields.return_date,
    JSON.stringify(fields.return_condition), fields.if_not_returned,
    now, reqId,
  ]);
  // The status guard misses when the other party cancelled or returned it first.
  if (res.changed === 0) {
    closeModal();
    return writeFailed(null, SAVE_WORDS, { id: reqId, allowed: ["pending"], closed: "This request can no longer be changed." });
  }

  Object.assign(req, {
    item_name: fields.item_name, item_description: fields.item_description,
    needed_date: fields.needed_date, return_date: fields.return_date,
    return_condition: fields.return_condition, if_not_returned: fields.if_not_returned,
    return_condition_json: JSON.stringify(fields.return_condition),
    // Both agreements are reset by the UPDATE above and nothing else: they were
    // given on the old terms, and loadRequests counts an agreement only for
    // the terms the request has now. Neither party is agreed until they agree again.
    borrower_outdated: !!(req.borrower_agreed || req.borrower_outdated),
    lender_outdated:   !!(req.lender_agreed || req.lender_outdated),
    borrower_agreed: false, lender_agreed: false,
    updated_at: now,
  });
  error = "";
  closeModal();
  render();

  // Fire-and-forget side effects, only once the edit took effect
  const otherName = isBorrower ? memberName(req.lender_id) : memberName(req.borrower_id);
  logActivity(reqId, req.borrower_id, req.lender_id, "updated", `${ME.name} updated the request — waiting for ${otherName} to re-agree`).catch(() => {});
  notify(
    `Borrow request updated`,
    `${ME.name} updated the request for "${fields.item_name}". Please review and agree to the new terms.`,
  ).catch(() => {});
  // Take the editor's own flag off the record. api/agree can only ever change
  // the caller's flag, so the other party's stays where it is, already not
  // counted (see loadRequests), until they agree to the new terms themselves.
  // The editor is not agreed again here: that would lock the request on the
  // strength of the other party's old agreement.
  (mineOnRecord ? agreeOnServer(reqId, false) : Promise.resolve())
    .then(() => reloadAfterWrite(), (e) => writeFailed(e, SAVE_WORDS));
}

async function agreeRequest(reqId) {
  const req = requests.find(r => r.id === reqId);
  if (!req || req.status !== "pending" || waitingOnTheirReview(req, ME.id)) return;

  const isBorrower  = req.borrower_id === ME.id;
  const theirAgreed = isBorrower ? req.lender_agreed : req.borrower_agreed;
  const mineOutdated = isBorrower ? req.borrower_outdated : req.lender_outdated;
  const terms = termsOf(req);
  const now = new Date().toISOString();

  // Optimistic update
  if (isBorrower) req.borrower_agreed = true; else req.lender_agreed = true;
  if (theirAgreed) { req.status = "locked"; req.locked_at = now; }
  req.saving = true; // drawn ahead of the hub's answer; gone once the list is re-read
  req.updated_at = now;
  error = "";
  closeModal();
  render();

  // Persist via the server endpoint (sets only the caller's flag, locks when both agree).
  // An agreement of mine left from before an edit comes off first, so the hub
  // lets go of the old terms and records this one against the terms shown here.
  (mineOutdated ? agreeOnServer(reqId, false) : Promise.resolve()).then(() => agreeOnServer(reqId, true, terms)).then((out) => {
    // Fire-and-forget side effects, only once the hub recorded the agreement.
    // The hub says whether THIS request locked it; the page's own view of the
    // other party's flag is the fallback.
    const locked = out?.locked_by_this_request ?? theirAgreed;
    logActivity(reqId, req.borrower_id, req.lender_id, "agreed", `${ME.name} agreed to the terms`).catch(() => {});
    if (locked) {
      logActivity(reqId, req.borrower_id, req.lender_id, "locked", "Both parties agreed — request is now locked").catch(() => {});
      notify(
        `🔒 Borrow request locked!`,
        `Both ${memberName(req.borrower_id)} and ${memberName(req.lender_id)} agreed to the borrow of "${req.item_name}"`,
      ).catch(() => {});
      publishEvent("borrowing.agreed", reqId, { item: req.item_name, borrower_id: req.borrower_id, lender_id: req.lender_id });
    } else {
      const otherName = isBorrower ? memberName(req.lender_id) : memberName(req.borrower_id);
      notify(
        `${ME.name} agreed to the borrow request`,
        `${ME.name} agreed to the terms for "${req.item_name}" — waiting for ${otherName} to agree`,
      ).catch(() => {});
    }
    return true;
  }, (e) => { writeFailed(e, { action: "agree to the request", thing: "request" }); return false; })
    .then((stored) => stored && reloadAfterWrite(req));
}

async function withdrawAgreement(reqId) {
  const req = requests.find(r => r.id === reqId);
  if (!req || req.status !== "pending") return;

  const isBorrower = req.borrower_id === ME.id;
  const now = new Date().toISOString();

  // Optimistic update
  if (isBorrower) req.borrower_agreed = false; else req.lender_agreed = false;
  req.updated_at = now;
  error = "";
  closeModal();
  render();

  agreeOnServer(reqId, false).then(() => {
    logActivity(reqId, req.borrower_id, req.lender_id, "withdrawn", `${ME.name} withdrew their agreement`).catch(() => {});
    notify(
      `Agreement withdrawn`,
      `${ME.name} withdrew their agreement for the borrow of "${req.item_name}"`,
    ).catch(() => {});
    return true;
  }, (e) => { writeFailed(e, { action: "withdraw your agreement", thing: "request" }); return false; })
    .then((stored) => stored && reloadAfterWrite());
}

async function markReturned(reqId) {
  if (!await hubConfirm({ message: "Mark this item as returned?", confirmLabel: "Mark returned" })) return;
  const req = requests.find(r => r.id === reqId);
  const now = new Date().toISOString();

  // Optimistic update
  if (req) { req.status = "returned"; req.updated_at = now; }
  error = "";
  closeModal();
  render();

  // First one wins: a request that is already returned or cancelled is closed,
  // and the WHERE leaves it alone. A refused write still answers 200, so
  // `changed` is the answer.
  db(`UPDATE app_borrowing__requests SET status = 'returned', updated_at = ? WHERE id = ? AND status NOT IN ('returned', 'cancelled')`, [now, reqId])
    .then((res) => {
      // The guard admits every status but returned/cancelled, which `closed`
      // answers: a row found in any other was refused by the row policy.
      if (res.changed === 0) return writeFailed(null, RETURN_WORDS, { id: reqId, closed: CLOSED_LINE });
      if (req) {
        logActivity(reqId, req.borrower_id, req.lender_id, "returned", `${ME.name} marked the item as returned`).catch(() => {});
        notify(`Item returned`, `${ME.name} marked "${req.item_name}" as returned`).catch(() => {});
        publishEvent("borrowing.returned", reqId, { item: req.item_name, borrower_id: req.borrower_id, lender_id: req.lender_id });
      }
      return true;
    }, (e) => { writeFailed(e, RETURN_WORDS); return false; })
    // The UPDATE is stored: a failed re-read is logged, not shown as a failed write.
    .then((stored) => stored === true && reloadAfterWrite());
}
const RETURN_WORDS = { action: "mark the item as returned", thing: "request" };
const CLOSED_LINE = "This request was already returned or cancelled.";

async function cancelRequest(reqId) {
  if (!await hubConfirm({ message: "Cancel this borrowing request?", confirmLabel: "Cancel request" })) return;
  const req = requests.find(r => r.id === reqId);
  const now = new Date().toISOString();

  // Optimistic update
  if (req) { req.status = "cancelled"; req.updated_at = now; }
  error = "";
  closeModal();
  render();

  db(`UPDATE app_borrowing__requests SET status = 'cancelled', updated_at = ? WHERE id = ? AND status NOT IN ('returned', 'cancelled')`, [now, reqId])
    .then((res) => {
      if (res.changed === 0) return writeFailed(null, CANCEL_WORDS, { id: reqId, closed: CLOSED_LINE });
      if (req) {
        logActivity(reqId, req.borrower_id, req.lender_id, "cancelled", `${ME.name} cancelled the request`).catch(() => {});
        notify(`Borrow request cancelled`, `${ME.name} cancelled the request to borrow "${req.item_name}"`).catch(() => {});
      }
      return true;
    }, (e) => { writeFailed(e, CANCEL_WORDS); return false; })
    .then((stored) => stored === true && reloadAfterWrite());
}
const CANCEL_WORDS = { action: "cancel the request", thing: "request" };

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  // Programmatic focus works inside cross-origin iframes (unlike the autofocus
  // attribute, which the browser blocks) because it rides the user's click gesture.
  modalEl.querySelector("[data-autofocus]")?.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

  `);

  modalEl.querySelectorAll(".condition-toggle input").forEach(cb => {

  });

window.submitForm = async function(existingId) {
  const item_name        = document.getElementById("f-item").value.trim();
  const item_description = document.getElementById("f-desc").value.trim();
  const needed_date      = document.getElementById("f-needed").value;
  const return_date      = document.getElementById("f-return").value;
  const return_condition = [...document.querySelectorAll(".condition-toggle input:checked")].map(cb => cb.value);
  const if_not_returned  = document.getElementById("f-consequence").value.trim();

  if (!item_name)   { document.getElementById("f-item").focus();   return; }
  if (!needed_date) { document.getElementById("f-needed").focus(); return; }
  if (!return_date) { document.getElementById("f-return").focus(); return; }

  const submitBtn = modalEl?.querySelector(".modal-actions .btn-primary");
  const errorEl = document.getElementById("f-error");
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Saving…"; }
  if (errorEl) { errorEl.hidden = true; errorEl.textContent = ""; }

  try {
    if (existingId) {
      await updateRequest(existingId, { item_name, item_description, needed_date, return_date, return_condition, if_not_returned });
    } else {
      const lenderEl = document.getElementById("f-lender");
      const lender_id = lenderEl?.value;
      if (!lender_id) return;
      await createRequest({ item_name, item_description, lender_id, needed_date, return_date, return_condition, if_not_returned }, modalEl);
    }
  } catch (e) {
    // Nothing was saved: say so here and leave the form as typed, ready to send again.
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = existingId ? "Save Changes" : "Create Request"; }
    console.error(e);
    if (errorEl) { errorEl.textContent = failureLine(e, SAVE_WORDS); errorEl.hidden = false; }
  }
};

    </div>` : ""}

    ${req.if_not_returned ? `
    <div class="detail-section">
      <div class="detail-label">If not returned</div>
      <div class="detail-value" style="font-style:italic">${esc(req.if_not_returned)}</div>
    </div>` : ""}

    <div class="detail-section">
      <div class="detail-label">Agreements</div>
      ${agreementHtml}
      ${involved && waiting ? `<div class="form-notice" data-testid="agree-waiting">${esc((isBorrower ? lender : borrower)?.name ?? "The other person")} agreed before this request was edited, and has to agree to it again before you can.</div>` : ""}
    </div>

    ${req.locked_at ? `<div class="locked-notice">${glyph("lock")} Locked on ${formatDate(req.locked_at.split("T")[0])}</div>` : ""}

    <div class="modal-actions">
      ${canAgree && !myAgreed && !waiting ? `<button class="btn btn-success" data-testid="agree-btn" data-request-id="${esc(req.id)}" data-action="agree" data-id="${esc(req.id)}">${glyph("tick")} I Agree</button>` : ""}
      ${canAgree && myAgreed  ? `<button class="btn btn-ghost"   data-testid="withdraw-btn" data-request-id="${esc(req.id)}" data-action="withdraw" data-id="${esc(req.id)}">Withdraw Agreement</button>` : ""}
      ${canReturn              ? `<button class="btn btn-primary" data-testid="return-btn" data-request-id="${esc(req.id)}" data-action="return" data-id="${esc(req.id)}">Mark Returned</button>` : ""}
      ${canCancel              ? `<button class="btn btn-danger btn-sm" data-testid="cancel-btn" data-request-id="${esc(req.id)}" data-action="cancel" data-id="${esc(req.id)}">Cancel</button>` : ""}
      <button class="btn btn-ghost" onclick="closeModal()">Close</button>
    </div>
  `);
}

window.openEditForm = function(reqId) {
  const req = requests.find(r => r.id === reqId);
  closeModal();
  if (req) openRequestForm(req);
};

window.agreeRequest       = agreeRequest;
window.withdrawAgreement  = withdrawAgreement;
window.markReturned       = markReturned;
window.cancelRequest      = cancelRequest;
window.closeModal         = closeModal;

// Delegated handler for id-bearing actions. Row ids are attacker-controllable via
// raw /api/db and esc() does NOT escape single quotes, so an inline
// onclick="fn('${id}')" would be a stored-XSS breakout vector — use data-* + this.
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const id = el.dataset.id ?? "";
  switch (el.dataset.action) {
    case "detail":   window.openDetailModal(id); break;
    case "edit":     window.openEditForm(id); break;
    case "agree":    agreeRequest(id); break;
    case "withdraw": withdrawAgreement(id); break;
    case "return":   markReturned(id); break;
    case "cancel":   cancelRequest(id); break;
    case "submit":   window.submitForm(id); break;
  }
});

// ─── Render ───────────────────────────────────────────────────────────────
function renderRequestCard(req) {
  const isBorrower  = ME?.id === req.borrower_id;
  const otherId     = isBorrower ? req.lender_id : req.borrower_id;
  const otherName   = memberName(otherId);
  const roleLabel   = isBorrower ? "from" : "to";
  const myAgreed    = isBorrower ? req.borrower_agreed : req.lender_agreed;
  const theirAgreed = isBorrower ? req.lender_agreed   : req.borrower_agreed;
  const needsAction = needsMyAction(req, ME?.id);

  return `
    <div class="request-card ${needsAction ? "needs-action" : ""}" data-testid="request-card" data-request-id="${esc(req.id)}" data-request-status="${esc(req.status)}"${req.saving ? ` data-saving="yes"` : ""} data-action="detail" data-id="${esc(req.id)}">
      <div class="request-main">
        <div class="request-item">${esc(req.item_name)}</div>
        <div class="request-meta">
          <div class="avatar xs" style="background:${mc(otherId)}">${initial(otherName)}</div>
          ${roleLabel} ${esc(otherName)}
        </div>
        <div class="request-dates">${formatDate(req.needed_date)} → ${formatDate(req.return_date)}</div>
      </div>
      <div class="request-right">
        ${statusHtml(req.status)}
        ${req.status === "pending" ? `
        <div class="agree-dots" title="Agreements: borrower / lender">
          <span class="agree-dot ${(isBorrower ? myAgreed : theirAgreed) ? "on" : ""}"></span>
          <span class="agree-dot ${(isBorrower ? theirAgreed : myAgreed) ? "on" : ""}"></span>
        </div>` : ""}
        ${needsAction ? `<div class="action-needed">Needs your approval</div>` : ""}
      </div>
    </div>
  `;
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  render();
});

function render() {
  if (!ME) {
    document.getElementById("root").innerHTML = `<div class="empty">Please log in to use Borrowing.</div>`;
    return;
  }

  const forMe  = filterRequests(requests, ME.id, "for-me");
  const fromMe = filterRequests(requests, ME.id, "from-me");

  const forMeBadge  = pendingBadgeCount(requests, ME.id, "for-me");
  const fromMeBadge = pendingBadgeCount(requests, ME.id, "from-me");

  const scoped = (activeTab === "for-me" ? forMe : fromMe);
  const list = searchQ ? scoped.filter(r => searchMatch(searchQ, searchableFields(r))) : scoped;

  const listHtml = list.length === 0
    ? (loadFailed ? "" : searchQ
      ? `<div class="empty">No requests match "${esc(searchQ)}".</div>`
      : `<div class="empty">${activeTab === "for-me"
        ? "No one has asked to borrow anything from you."
        : "You haven't made any borrow requests yet."}</div>`)
    : list.map(r => renderRequestCard(r)).join("");

  document.getElementById("root").innerHTML = `
    <header>
      <div>
        <h1>${glyph("handshake")} Borrowing</h1>
        <div class="sub">Track borrowed items &amp; agreements</div>
      </div>
      ${loadFailed ? "" : `<button class="btn btn-ghost"
        style="background:rgba(255,255,255,.15);color:white;border-color:rgba(255,255,255,.3)"
        data-testid="new-request" onclick="openNewRequest()">+ Request</button>`}
    </header>

    <div class="tabs">
      <button class="tab ${activeTab === "for-me" ? "active" : ""}" data-testid="app-tab" data-tab="for-me" onclick="setTab('for-me')">
        For Me ${forMeBadge > 0 ? `<span class="tab-badge">${forMeBadge}</span>` : ""}
      </button>
      <button class="tab ${activeTab === "from-me" ? "active" : ""}" data-testid="app-tab" data-tab="from-me" onclick="setTab('from-me')">
        From Me ${fromMeBadge > 0 ? `<span class="tab-badge">${fromMeBadge}</span>` : ""}
      </button>
    </div>

    ${loadFailed ? `<div class="load-error" data-testid="load-error" role="alert" style="margin:12px 0 0"><span>Couldn’t load the borrow requests.</span> <button type="button" class="load-error-retry" data-testid="load-retry" onclick="retryLoad()">Try again</button></div>` : ""}
    ${error ? `<div class="form-notice" data-testid="page-error" role="alert" style="margin:12px 0 0">${esc(error)}</div>` : ""}
    ${scoped.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search requests…" aria-label="Search requests" value="${esc(searchQ)}" /></div>` : ""}
    <div>${listHtml}</div>
  `;

  // render() redraws the whole view, so put the caret back after a keystroke.
  const searchEl = document.getElementById("search");
  if (searchQ && searchEl) {
    searchEl.focus();
    searchEl.setSelectionRange(searchQ.length, searchQ.length);
  }
}

window.setTab = function(tab) { activeTab = tab; error = ""; render(); };
window.openNewRequest = function() { openRequestForm(); };
window.openDetailModal = function(id) {
  const req = requests.find(r => r.id === id);
  if (req) openDetailModal(req);
};

// ─── Deep link ────────────────────────────────────────────────────────────
function handleDeepLink() {
  const requestId = new URLSearchParams(window.location.search).get("requestId");
  if (!requestId) return;
  const req = requests.find(r => r.id === requestId);
  if (req) openDetailModal(req);
}

// ─── Init ─────────────────────────────────────────────────────────────────
async function firstLoad() {
  try {
    await Promise.all([loadMembers(), DB ? loadRequests() : Promise.resolve()]);
    loadFailed = false;
  } catch { loadFailed = true; }
  render();
  if (!loadFailed) handleDeepLink(); // never open a detail over a failed load
}
window.retryLoad = firstLoad;
firstLoad();
</script>
</body>
</html>
